mutation studentTransferRestore($input: StudentTransferRequestIdsInput!) {
  platform {
    studentTransferRestore(input: $input) {
      isSuccess
      warning {
        code
        message
        duplicates
        missing
        driftedIds
        failures {
          key
          message
        }
        offendingIds {
          id
          status
        }
        transferRequestId
      }
      studentTransferRequests {
        id
        uid
        status
      }
    }
  }
}
