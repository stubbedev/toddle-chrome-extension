query ListSchoolStaff($first: Int, $after: String, $filters: OrgConnectionFilterInput, $orderBy: ORDER_BY_ENUM, $orderByDirection: ORDER_BY_DIRECTION) {
  platform {
    organization {
      id
      staff(first: $first, after: $after, filters: $filters, orderBy: $orderBy, orderByDirection: $orderByDirection) {
        pageInfo {
          endCursor
          hasNextPage
        }
        edges {
          node {
            id
            firstName
            lastName
            preferredName
            email
            phoneNumber
            profileImage
            designation {
              id
              title
            }
            otherDetails {
              id
              phoneNumber
            }
          }
        }
      }
    }
  }
}
