query getOrganizationSubjectGroups($id: ID!, $filters: SubjectGroupFilterInput) {
  node(id: $id, type: ORGANIZATION) {
    id
    ... on Organization {
      id
      subjectGroups(filters: $filters) {
        id
        name
        curriculumProgram {
          id
          type
          nodeInterfaceType
          label
          acronym
          academicSetupType
        }
      }
    }
  }
}
