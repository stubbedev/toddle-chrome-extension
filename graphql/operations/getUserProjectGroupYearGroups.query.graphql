query getUserProjectGroupYearGroups($id: ID!, $type: ENTITY_TYPE_ENUM!, $filters: UserProjectGroupFilter) {
  node(id: $id, type: $type) {
    id
    ... on Staff {
      id
      projectGroups(filters: $filters) {
        ...projectGroupInfoBasicDetails
      }
    }
    ... on Student {
      id
      projectGroups(filters: $filters) {
        ...projectGroupInfoBasicDetails
      }
    }
  }
}
