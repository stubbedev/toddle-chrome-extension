query getProjectGroupStudentsWithProjects($id: ID!, $studentFilters: ProjectGroupStudentFilters, $projectFieldFilters: PlannerFieldFilter, $fetchFields: Boolean!, $fetchProjects: Boolean!, $fetchProjectStudents: Boolean!, $academicYearId: ID) {
  node(id: $id, type: PROJECT_GROUP) {
    ... on ProjectGroup {
      id
      students(filters: $studentFilters) {
        totalCount
        pageInfo {
          hasNextPage
          endCursor
        }
        edges {
          node {
            id
            student {
              ...projectGroupStudentsItem
            }
          }
        }
      }
    }
  }
}
