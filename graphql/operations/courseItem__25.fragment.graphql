fragment courseItem on Course {
  id
  title
  sourcedId
  profileImage
  profileImageData {
    url
    icon
    acronym
    color
  }
  isArchived
  isMappedToMe
  academicYears {
    id
    startDate
    endDate
  }
  genericTags {
    id
    label
    type
  }
  userMap(filters: $userMapFilters) {
    ...userMapItem
  }
  allPosts {
    totalCount
  }
  unitPlans {
    totalCount
  }
  flatUnitPlans {
    totalCount
  }
  grades(filters: {academicYearId: $academicYearId}) {
    ...gradeItem
  }
  primaryGrade {
    ...gradeItem
  }
  subjects(filters: {archivalState: ALL}) {
    ...subjectWithSubjectGroupItem
  }
  subjectWiseEntityCount(filters: {curriculumProgramIds: $curriculumProgramIds}) {
    subjectId
    unitPlanCount
    assignmentCount
  }
  subjectGroups {
    id
    name
  }
  curriculumProgram {
    ...curriculumProgramBasicDetailsItem
  }
  allCollaborators(filters: $collaboratorFilters) {
    totalCount
    edges {
      node {
        id
        firstName
        middleName
        lastName
        preferredName
        prefix
        suffix
        pronouns
        isArchived
        isArchivedV2(filters: {academicYearId: $academicYearId})
        profileImage
        displayRole
        designation {
          id
          title
        }
        type
        isDevUser
        rnpRoleContextDetail(filters: $rnpRoleContextDetailFilter) {
          id
          contextType
          role {
            id
            label
            isCustomRole
          }
          context {
            id
          }
        }
      }
    }
  }
  learningCourse {
    id
    title
  }
  assignments {
    totalCount
  }
  tags {
    id
    key
    value
  }
}
