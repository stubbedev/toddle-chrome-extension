query getWorkbookTemplates($id: ID!, $types: [ORGANIZATION_RESOURCE_TYPE_ENUM!], $searchText: String!, $first: Int, $after: String, $states: [ORGANIZATION_RESOURCE_STATE_ENUM], $status: ORGANIZATION_RESOURCE_STATUS_ENUM, $courseIds: [ID!], $createdBy: [ID!]) {
  node(id: $id, type: ORGANIZATION) {
    id
    ... on Organization {
      organizationResources(types: $types, filters: {states: $states}) {
        ...organizationResourceBasicDetailsItem
      }
    }
  }
}
