query integrationSyncCalendarStudentTimetable($jobId: ID!, $studentIds: [ID!]!, $startDate: String, $endDate: String, $academicYearId: ID!, $curriculumProgramId: ID!) {
  integration {
    integrationSyncCalendarStudentTimetable(input: {jobId: $jobId, studentIds: $studentIds, startDate: $startDate, endDate: $endDate, academicYearId: $academicYearId, curriculumProgramId: $curriculumProgramId}) {
      routine {
        serviceId
        schedule {
          rotationDay {
            label
            serviceId
          }
        }
      }
      timetable {
        date
        course {
          id
          title
        }
        period {
          id
          label
          abbreviation
        }
        day
        rotationDay {
          id
          label
        }
        location
        locationV2 {
          id
          label
        }
        startTime
        endTime
        teachers {
          id
          profileImage
          firstName
          lastName
          middleName
        }
      }
    }
  }
}
