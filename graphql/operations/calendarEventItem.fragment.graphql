fragment calendarEventItem on CalendarEventItem {
  id
  eventType
  label
  isFullDayEvent
  startDateTime
  eventTag {
    id
    label
    colorCode
    uid
  }
  location
  description
  createdBy {
    id
    email
    firstName
    lastName
    middleName
    profileImage
  }
  meeting {
    id
    label
    urls {
      ... on OtherMeetingUrls {
        type
        url
      }
      ... on ZoomMeetingUrls {
        type
        joinUrl
        startUrl
        meetingCode
      }
      ... on MicrosoftTeamMeetingUrls {
        type
        joinUrl
        joinWebUrl
        meetingCode
        passcode
      }
      ... on GoogleMeetingUrls {
        type
        url
        meetingCode
      }
    }
    type
    createdBy {
      id
      email
      firstName
      lastName
      middleName
      profileImage
    }
  }
  recurringSetting {
    frequency
    weekDays
    interval
    endDate
    monthDays
    setPositions
    count
    timezone
  }
  metadata {
    skipNonOperationalDays
    recurrenceType
  }
  sharedWith
  attachments {
    id
    type
    name
    url
    metadata
    displaySequence
    mimeType
  }
}
