query getStudentProgressReportTemplateDetails($studentProgressReportId: ID!, $templateFilters: StudentReportTemplateFilter, $skipSignatories: Boolean!) {
  node(id: $studentProgressReportId, type: STUDENT_PROGRESS_REPORT) {
    id
    ... on StudentProgressReport {
      id
      template(filters: $templateFilters)
      signatories @skip(if: $skipSignatories) {
        ...progressReportSignatoriesItem
      }
    }
  }
}
