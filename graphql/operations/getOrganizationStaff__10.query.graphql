query getOrganizationStaff($id: ID!, $filters: OrgConnectionFilterInput, $first: Int, $after: String) {
  node(id: $id, type: ORGANIZATION) {
    ... on Organization {
      id
      staff(first: $first, after: $after, filters: $filters) {
        edges {
          node {
            id
            firstName
            lastName
            email
            profileImage
          }
        }
        pageInfo {
          hasNextPage
          endCursor
        }
        totalCount
      }
    }
  }
}
