mutation resetAIConversation($input: ResetAiConversationInput!) {
  ai {
    resetAiConversation(input: $input) {
      isSuccess
      warning
      responseArray {
        id
        entityType
        messages {
          totalCount
          edges {
            node {
              ...aiMessageItem
            }
          }
        }
      }
    }
  }
}
