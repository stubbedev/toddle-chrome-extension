mutation createLearningCourse($input: CreateLearningCourseInput!, $collaboratorFilters: LearningCourseCollaboratorFilters, $classesFilters: LearningCourseClassFilter, $gradeFilters: LearningCourseGradeFilters) {
  planner {
    createLearningCourse(input: $input) {
      isSuccess
      learningCourse {
        ...learningCourseItem
      }
    }
    __typename
  }
}
