query getStaffCourseFeed($id: ID!, $first: Int = 10, $after: String, $filters: CourseFilter, $orderBy: ORDER_BY_ENUM, $orderByDirection: ORDER_BY_DIRECTION) {
  node(id: $id, type: STAFF) {
    id
    ... on Staff {
      coursesV2(first: $first, after: $after, filters: $filters, orderBy: $orderBy, orderByDirection: $orderByDirection) {
        pageInfo {
          endCursor
          hasNextPage
        }
        totalCount
        edges {
          node {
            id
            title
            sourcedId
            profileImageData {
              icon
              acronym
              url
              color
            }
            curriculumProgram {
              id
              type
              acronym
            }
            learningCourse {
              id
              title
            }
            students {
              edges {
                node {
                  id
                }
              }
            }
          }
        }
      }
    }
  }
}
