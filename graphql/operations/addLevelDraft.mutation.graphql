mutation addLevelDraft($input: LevelDraftAddInput!) {
  planner {
    addLevelDraft(input: $input) {
      key
      label
      reportDisplayName
      abbreviation
      associatedSubjects {
        key
      }
      associatedStudents {
        id
      }
      associatedCourses {
        key
      }
    }
    __typename
  }
}
