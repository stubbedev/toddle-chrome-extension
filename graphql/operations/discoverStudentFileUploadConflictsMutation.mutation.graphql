mutation discoverStudentFileUploadConflictsMutation($input: DiscoverStudentFileUploadConflictsInput!) {
  platform {
    discoverStudentFileUploadConflicts(input: $input) {
      isSuccess
      warning
      conflicts {
        itemId
        conflicts {
          folderName
          existingResourceId
        }
      }
      discoveryErrors {
        itemId
        message
      }
    }
  }
}
