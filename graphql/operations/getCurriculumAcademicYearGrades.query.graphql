query getCurriculumAcademicYearGrades($organizationId: ID!, $gradeFilters: GradeFilterInput) {
  node(id: $organizationId, type: ORGANIZATION) {
    id
    ... on Organization {
      id
      grades(filters: $gradeFilters) {
        id
        name
        globalGrade {
          uid
          id
        }
      }
    }
  }
}
