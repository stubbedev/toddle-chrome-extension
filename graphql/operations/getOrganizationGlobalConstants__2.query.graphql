query getOrganizationGlobalConstants($organizationId: ID!, $filter: GlobalConstantsFilterOptions) {
  node(id: $organizationId, type: ORGANIZATION) {
    ... on Organization {
      id
      globalConstants(filter: $filter) {
        ...organizationGlobalConstantItem
      }
    }
  }
}

fragment libraryEntityBasicDetailsItem on LibraryGenericEntity {
  id
  type
  label
}
