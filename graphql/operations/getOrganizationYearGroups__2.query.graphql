query getOrganizationYearGroups($id: ID!, $filters: YearGroupFilter, $groupStudentFilters: GroupStudentFilter, $yearGroupGradeFilters: YearGroupGradeFilters) {
  node(id: $id, type: ORGANIZATION) {
    id
    ... on Organization {
      id
      yearGroups(filters: $filters) {
        ...basicYearGroupDetails
      }
    }
  }
}
