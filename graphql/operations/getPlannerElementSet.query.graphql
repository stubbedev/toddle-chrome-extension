query getPlannerElementSet($id: ID!, $filters: PlannerElementFilters) {
  node(id: $id, type: PLANNER_ELEMENT_SET) {
    id
    ... on PlannerElementSet {
      id
      label
      type
      nodes(filters: $filters) {
        id
        label
        subText
        code
        type
        subText
        parent
        children
        depth
        associatedParents {
          id
        }
      }
    }
  }
}
