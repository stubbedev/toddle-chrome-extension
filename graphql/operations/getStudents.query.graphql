query getStudents($id: ID!, $studentsFilters: OrgConnectionFilterInput, $first: Int, $after: String, $orderBy: ORDER_BY_ENUM, $orderByDirection: ORDER_BY_DIRECTION) {
  node(id: $id, type: ORGANIZATION) {
    id
    ... on Organization {
      id
      students(filters: $studentsFilters, first: $first, after: $after, orderBy: $orderBy, orderByDirection: $orderByDirection) {
        totalCount
        pageInfo {
          hasNextPage
          endCursor
        }
        edges {
          node {
            id
            ...studentNameFields
            profileImage
            yearGroup {
              id
              name
            }
            alertTypes {
              ...alertTypeFields
            }
          }
        }
      }
    }
  }
}
