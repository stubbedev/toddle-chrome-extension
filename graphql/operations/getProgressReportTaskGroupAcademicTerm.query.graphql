query getProgressReportTaskGroupAcademicTerm($id: ID!) {
  node(id: $id, type: PROGRESS_REPORT_TASK_GROUP) {
    id
    ... on ProgressReportTaskGroup {
      id
      academicTerms {
        id
        label
        type
        lockingStatus
        associatedAcademicTermEntities {
          id
          academicTerm {
            id
            label
            lockingStatus
          }
        }
      }
      academicTerms {
        id
        label
        type
      }
    }
  }
}
