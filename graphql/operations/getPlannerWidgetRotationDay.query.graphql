query getPlannerWidgetRotationDay($id: ID!, $type: ENTITY_TYPE_ENUM!, $periodFilters: PeriodFilterOptions) {
  node(id: $id, type: $type) {
    ... on Student {
      id
      enrolledPeriodsV2(filters: $periodFilters) {
        date
        rotationDay {
          id
          label
        }
      }
    }
    ... on Staff {
      id
      enrolledPeriodsV2(filters: $periodFilters) {
        date
        rotationDay {
          id
          label
        }
      }
    }
  }
}
