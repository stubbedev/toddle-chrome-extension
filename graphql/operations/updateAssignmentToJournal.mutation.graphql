mutation updateAssignmentToJournal($assignmentId: ID!, $studentAssignmentIds: [ID!], $postData: PostCompleteInput) {
  platform {
    updateAssignmentToJournal(input: {assignmentId: $assignmentId, studentAssignmentIds: $studentAssignmentIds, postData: $postData}) {
      response
      warning
    }
  }
}
