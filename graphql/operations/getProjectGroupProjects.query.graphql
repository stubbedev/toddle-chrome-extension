query getProjectGroupProjects($id: ID!, $filters: ProjectGroupProjectsFilters, $studentCourseFilters: UserCourseMapFilters, $skipStudentDetails: Boolean!, $skipCourseDetails: Boolean!) {
  node(id: $id, type: PROJECT_GROUP) {
    id
    ... on ProjectGroup {
      id
      projects(filters: $filters) {
        edges {
          node {
            ...projectStudentInfo
          }
        }
      }
    }
  }
}
