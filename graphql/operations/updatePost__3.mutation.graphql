mutation updatePost($postId: ID!, $courseId: ID, $title: String, $description: String, $updatedBy: ID!, $unitPlanId: ID, $resourceId: ID, $resourceType: FLOW_SECTION_ITEM_ENUM, $elementsPYP: [PYPElement!], $studentIds: [ID!], $state: PostStateEnum!, $isPrivate: Boolean, $isHiddenFromStudents: Boolean, $attachments: [AttachmentInput!], $evaluationCycleId: ID, $addedFolders: [ID!], $addedFolderNames: [String!], $removedFolders: [ID!], $addedPractices: [ID!], $removedPractices: [ID!], $approvComment: String, $rejectComment: String, $newAddedRatings: [IBPYPElementRatingInput!], $removedRatings: [DeleteIBPYPElementRatingsInput!], $isStudentIndividuallyRated: Boolean, $addAttachments: [AttachmentInput!], $removeAttachmentIds: [ID!], $learnerPortfolioResource: OrganizationResourceUpdateInput, $collections: PostCollectionUpdateInput, $learnerPortfolioId: ID) {
  documentation {
    updatePost(input: {postId: $postId, courseId: $courseId, title: $title, description: $description, updatedBy: $updatedBy, unitPlanId: $unitPlanId, resourceId: $resourceId, resourceType: $resourceType, elementsPYP: $elementsPYP, studentIds: $studentIds, state: $state, isPrivate: $isPrivate, isHiddenFromStudents: $isHiddenFromStudents, attachments: $attachments, folders: {addedFolders: $addedFolders, removedFolders: $removedFolders, addedFolderNames: $addedFolderNames}, practices: {evaluationCycleId: $evaluationCycleId, addedPractices: $addedPractices, removedPractices: $removedPractices}, approvComment: $approvComment, rejectComment: $rejectComment, newAddedRatings: $newAddedRatings, removedRatings: $removedRatings, isStudentIndividuallyRated: $isStudentIndividuallyRated, addAttachments: $addAttachments, removeAttachmentIds: $removeAttachmentIds, learnerPortfolioResource: $learnerPortfolioResource, collections: $collections, learnerPortfolioId: $learnerPortfolioId}) {
      ...learnerPortfolioPostItem
      __typename
    }
    __typename
  }
}
