fragment courseFlowResource on LearningCourseFlow {
  id
  item {
    id
    ... on Assessment {
      id
      title {
        id
        value
      }
      createdBy {
        profileImage
        firstName
        lastName
      }
      fields(uids: ["subjectLevel"]) {
        id
        value
        resolvedMinimalTree {
          ... on ResolvedFieldGenericTags {
            id
            type
            genericTags {
              id
              label
              __typename
            }
            __typename
          }
          __typename
        }
        __typename
      }
      ...organizationResourceItem
      type
      __typename
    }
    ... on UnitPlan {
      __typename
    }
    __typename
  }
  __typename
}

fragment worksheetItem on FlowSectionItem {
  id
  title {
    id
    value
  }
  createdBy {
    id
    profileImage
    firstName
    lastName
  }
  fields(uids: ["subjectLevel"]) {
    id
    value
    resolvedMinimalTree {
      ... on ResolvedFieldGenericTags {
        id
        type
        genericTags {
          id
          label
        }
      }
    }
  }
}
