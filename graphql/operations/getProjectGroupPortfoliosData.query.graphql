query getProjectGroupPortfoliosData($id: ID!, $filters: StudentProjectPortfolioFilters) {
  node(id: $id, type: PROJECT_GROUP) {
    id
    ... on ProjectGroup {
      id
      studentProjectPortfolio(filters: $filters) {
        edges {
          node {
            id
            student {
              ...studentInfo
            }
          }
        }
      }
    }
  }
}
