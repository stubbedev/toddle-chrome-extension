query getOrganizationClassFeed($first: Int, $after: String, $filters: CourseFilterInput, $orderBy: ORDER_BY_ENUM, $organizationId: ID!) {
  platform {
    organization(id: $organizationId) {
      id
      courses(first: $first, after: $after, orderBy: $orderBy, orderByDirection: ASC, filters: $filters) {
        pageInfo {
          endCursor
          hasNextPage
        }
        edges {
          node {
            id
            title
            learningCourse {
              id
              type
              title
              displayMetadata
            }
            curriculumProgram {
              id
            }
            profileImageData {
              url
              icon
              color
              acronym
            }
          }
        }
      }
    }
  }
}
