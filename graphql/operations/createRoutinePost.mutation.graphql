mutation createRoutinePost($courseId: ID!, $title: String, $description: String, $createdBy: ID!, $attachments: [AttachmentInput!], $studentIds: [ID!], $state: PostStateEnum!, $publishedBy: ID!, $isPrivate: Boolean, $isHiddenFromStudents: Boolean, $folders: [ID!], $folderNames: [String!], $curriculumProgramId: ID, $parentId: ID, $parentType: POST_ITEM_TYPE_ENUM, $academicYears: [ID!], $ibPYPElementRatings: [IBPYPElementRatingInput!], $isStudentIndividuallyRated: Boolean, $publishedAt: String, $studentActivities: [StudentActivityCreateInput!], $academicTermId: ID, $createFolders: [FolderInput!], $activityLog: ActivityLogInput, $taggedEntity: [TaggedEntityGenericInput!], $parentEntity: [ParentEntityGenericInput!], $templateId: ID, $feedType: POST_FEED_TYPE_ENUM) {
  documentation {
    createPost(input: {courseId: $courseId, title: $title, description: $description, createdBy: $createdBy, attachments: $attachments, studentIds: $studentIds, state: $state, publishedBy: $publishedBy, isPrivate: $isPrivate, isHiddenFromStudents: $isHiddenFromStudents, folders: $folders, folderNames: $folderNames, curriculumProgramId: $curriculumProgramId, parentId: $parentId, parentType: $parentType, academicYears: $academicYears, ibPYPElementRatings: $ibPYPElementRatings, isStudentIndividuallyRated: $isStudentIndividuallyRated, publishedAt: $publishedAt, studentActivities: $studentActivities, academicTermId: $academicTermId, createFolders: $createFolders, activityLog: $activityLog, taggedEntity: $taggedEntity, parentEntity: $parentEntity, postTemplateId: $templateId, feedType: $feedType}) {
      id
      __typename
    }
    __typename
  }
}
