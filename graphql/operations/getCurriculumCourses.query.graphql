query getCurriculumCourses($id: ID!, $first: Int, $after: String, $filters: CourseFilterInput, $fetchTemplates: Boolean!, $courseGradeFilters: CourseGradeFilters) {
  node(id: $id, type: ORGANIZATION) {
    id
    ... on Organization {
      courses(first: $first, after: $after, orderBy: TITLE, orderByDirection: ASC, filters: $filters) {
        totalCount
        pageInfo {
          hasNextPage
          endCursor
        }
        edges {
          node {
            id
            title
            academicYear
            grades(filters: $courseGradeFilters) {
              id
              name
              globalGrade {
                id
                uid
              }
            }
            primaryGrade(filters: $courseGradeFilters) {
              id
              plannerTemplates(filters: {templateType: [UNIT_PLAN]}) @include(if: $fetchTemplates) {
                id
                name
                unitType
                curriculum {
                  id
                }
              }
            }
            subjects {
              id
              name
            }
            academicYears {
              id
              startDate
              endDate
            }
          }
        }
      }
    }
  }
}
