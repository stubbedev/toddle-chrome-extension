query getGlobalCategories($id: ID!, $filters: GlobalCategoryFilters) {
  node(id: $id, type: CURRICULUM_PROGRAM) {
    id
    ... on CurriculumProgram {
      id
      globalCategory(filters: $filters) {
        edges {
          node {
            id
            name
          }
        }
      }
    }
  }
}
