query getMissingCategoriesForMigration($input: MissingCategoriesForAcademicTermMigrationInput!) {
  documentation {
    internalToolsData {
      progressReport {
        missingCategoriesForAcademicTermMigration(input: $input) {
          id
          subjectName
          gradeName
          categoryName
        }
      }
    }
  }
}
