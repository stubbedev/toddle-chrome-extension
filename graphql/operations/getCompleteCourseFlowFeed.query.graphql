query getCompleteCourseFlowFeed($learningCourseId: ID!, $filters: LearningCourseFlowFilter) {
  node(id: $learningCourseId, type: LEARNING_COURSE) {
    id
    ... on LearningCourse {
      id
      learningCourseFlowFeedWrapper {
        learningCourseFlowFeed(first: 10000, filters: $filters) {
          edges {
            node {
              id
            }
          }
        }
      }
      __typename
    }
    __typename
  }
}
