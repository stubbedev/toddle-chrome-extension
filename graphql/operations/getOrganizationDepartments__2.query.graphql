query getOrganizationDepartments($id: ID!, $filters: SubjectGroupFilterInput) {
  node(id: $id, type: ORGANIZATION) {
    id
    ... on Organization {
      id
      subjectGroups(filters: $filters) {
        id
        name
        type
        displaySequence
        isArchived
        globalSubjectGroup {
          id
        }
        sourceSubjects {
          id
          name
        }
      }
    }
  }
}
