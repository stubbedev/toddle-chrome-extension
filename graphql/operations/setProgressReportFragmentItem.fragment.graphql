fragment setProgressReportFragmentItem on ProgressReportTaskGroup {
  id
  title
  subtitle
  attendanceMode
  academicTerms {
    id
    lockingStatus
    associatedAcademicTermEntities {
      id
      academicTerm {
        id
        lockingStatus
      }
    }
