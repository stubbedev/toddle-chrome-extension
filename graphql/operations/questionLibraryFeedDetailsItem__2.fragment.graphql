fragment questionLibraryFeedDetailsItem on Question {
  id
  questionType {
    id
    uid
  }
  questionScoreV2
  questionTitleV2 {
    id
    uid
    value
  }
  difficulty
  librarySubjects {
    id
    label
  }
  associatedEntities {
    id
    ... on GenericTag {
      id
      label
    }
    ... on PlannerElementNode {
      id
      label
      depth
    }
  }
}
