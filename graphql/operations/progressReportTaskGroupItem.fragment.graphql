fragment progressReportTaskGroupItem on ProgressReportTaskGroup {
  id
  title
  subtitle
  attendanceMode
  studentReflectionAuthor
  studentReflectionDeadline
  createdAt
  deadlineDate
  footerDate
  pdfFilenameFormat
  reportingDates {
    startDate
    endDate
  }
  courseProgressReportTasks {
    id
    canArchive
    course {
      ...courseItem
    }
    parentEntity {
      id
      ... on Grade {
        id
        name
      }
    }
  }
  template {
    id
    name
    grades {
      id
    }
    gradingPeriodType
  }
  filteredNodes
  academicTerm {
    id
    label
  }
  academicTerms {
    id
    label
  }
}

fragment notificationItem on Notification {
  id
  type
  primaryEntity
  isNew
  isRead
  metadata
  category
  createdBy {
    id
    firstName
    lastName
    middleName
    profileImage
    type
    profileImage
    ... on Student {
      preferredName
      pronouns
      suffix
    }
  }
  createdAt
  updatedBy {
    id
    firstName
    lastName
    middleName
    profileImage
    ... on Student {
      preferredName
      pronouns
      suffix
    }
  }
  course {
    ...courseItem
    grades {
      id
      name
    }
    curriculumProgram {
      id
      type
    }
  }
  courses {
    id
    title
    curriculumProgram {
      id
      type
    }
  }
  updatedAt
  contextData {
    ... on Grade {
      id
      name
    }
    ... on Course {
      id
      title
      learningCourse {
        id
        title
        academicCourse {
          id
          label
        }
      }
    }
    ... on YearGroup {
      id
      name
    }
    ... on Student {
      id
      firstName
      lastName
      middleName
      type
      preferredName
      pronouns
      suffix
    }
    ... on BehaviourIncident {
      id
      uid
      category {
        id
        rootCategory {
          id
          name
        }
      }
    }
  }
  messageData
  extensionType
  extensionData
}
