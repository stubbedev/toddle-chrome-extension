query getCurriculumStandardSets($id: ID!, $type: ENTITY_TYPE_ENUM!, $subjectIds: [ID!], $setId: ID!, $orderBy: OrderByEnum, $orderByDirection: OrderByDirectionEnum) {
  node(id: $id, type: $type) {
    id
    ... on UBDCurriculumProgram {
      plannerElementNodeSets(orderBy: $orderBy, orderByDirection: $orderByDirection, filters: {status: [PUBLISHED, ARCHIVED, PARTIALLY_PUBLISHED], subjects: $subjectIds, plannerElementIds: [$setId]}) {
        ...subjectStandardFragment
      }
    }
    ... on IbMypCurriculumProgram {
      plannerElementNodeSets(orderBy: $orderBy, orderByDirection: $orderByDirection, filters: {status: [PUBLISHED, ARCHIVED, PARTIALLY_PUBLISHED], subjects: $subjectIds, plannerElementIds: [$setId]}) {
        ...subjectStandardFragment
      }
    }
    ... on IbPypCurriculumProgram {
      plannerElementNodeSets(orderBy: $orderBy, orderByDirection: $orderByDirection, filters: {status: [PUBLISHED, ARCHIVED, PARTIALLY_PUBLISHED], subjects: $subjectIds, plannerElementIds: [$setId]}) {
        ...subjectStandardFragmentPYP
      }
    }
    ... on IbDpCurriculumProgram {
      plannerElementNodeSets(orderBy: $orderBy, orderByDirection: $orderByDirection, filters: {status: [PUBLISHED, ARCHIVED, PARTIALLY_PUBLISHED], subjects: $subjectIds, plannerElementIds: [$setId]}) {
        ...subjectStandardFragment
      }
    }
  }
}
