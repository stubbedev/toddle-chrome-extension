query getStudentAttendanceStatisticsV2($studentId: ID!, $filters: StudentAttendanceFilters, $overAllPresenceFilter: StudentAttendanceFilters, $isAttendanceLayersEnabled: Boolean! = false) {
  node(id: $studentId, type: STUDENT) {
    id
    ... on Student {
      id
      ...studentNameFields
      attendanceV2(filters: $overAllPresenceFilter) {
        presenceOverview @skip(if: $isAttendanceLayersEnabled) {
          totalCount
          presencePercentage
          absencePercentage
          presenceNumber
          absenceNumber
          tier {
            id
            label
            color
          }
        }
        attendanceMetric(type: OVERALL) @include(if: $isAttendanceLayersEnabled) {
          totalCount
          presencePercentage
          absencePercentage
          presenceNumber
          absenceNumber
          tier {
            id
            label
            color
            minPercentage
            maxPercentage
          }
        }
      }
      attendanceV2(filters: $filters) {
        statistics {
          courseItems {
            ...attendanceStatisticCourseItem
          }
          activityItems {
            item {
              id
              name
            }
            percentage
          }
        }
        categorySummary {
          percentageItems {
            category {
              id
              label
              color
            }
            percentage
          }
        }
      }
    }
  }
}
