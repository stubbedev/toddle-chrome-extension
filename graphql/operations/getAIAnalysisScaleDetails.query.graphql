query getAIAnalysisScaleDetails($id: ID!) {
  node(id: $id, type: ASSESSMENT) {
    id
    ... on Assessment {
      id
      assessmentTools {
        edges {
          node {
            id
            assessmentToolType
            assessmentToolItem {
              id
              ... on Analysis {
                ...aiAnalysisItem
              }
            }
          }
        }
      }
    }
  }
}
