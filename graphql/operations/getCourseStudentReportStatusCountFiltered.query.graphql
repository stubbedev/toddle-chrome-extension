query getCourseStudentReportStatusCountFiltered($reportId: ID!, $reportStatusCountFilter: TaskStudentProgressReportsFilter) {
  node(id: $reportId, type: COURSE_PROGRESS_REPORT_TASK) {
    id
    ... on CourseProgressReportTask {
      id
      reportStatusCount(filters: $reportStatusCountFilter) {
        status
        count
      }
    }
  }
}
