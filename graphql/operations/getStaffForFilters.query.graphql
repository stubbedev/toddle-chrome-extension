query getStaffForFilters($organizationId: ID!, $filters: OrgConnectionFilterInput) {
  node(id: $organizationId, type: ORGANIZATION) {
    ... on Organization {
      id
      staff(filters: $filters) {
        edges {
          node {
            id
            firstName
            middleName
            lastName
            profileImage
            preferredName
            prefix
            suffix
            pronouns
          }
        }
      }
    }
  }
}
