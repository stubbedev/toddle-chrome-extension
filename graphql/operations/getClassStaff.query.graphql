query getClassStaff($id: ID!, $academicYearId: ID!, $collaboratorFilters: CollaboratorFilters, $rnpFilters: RnPRoleContextDetailFilterInput) {
  node(id: $id, type: COURSE) {
    id
    ... on Course {
      allCollaborators(filters: $collaboratorFilters) {
        totalCount
        edges {
          node {
            id
            firstName
            middleName
            lastName
            preferredName
            prefix
            suffix
            pronouns
            isArchived
            isArchivedV2(filters: {academicYearId: $academicYearId})
            profileImage
            type
            isDevUser
            rnpRoleContextDetail(filters: $rnpFilters) {
              id
              contextType
              role {
                id
                label
                isCustomRole
              }
              context {
                id
              }
            }
          }
        }
      }
    }
  }
}
