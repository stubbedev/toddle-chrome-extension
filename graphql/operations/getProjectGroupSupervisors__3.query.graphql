query getProjectGroupSupervisors($projectGroupId: ID!, $filters: ProjectGroupSupervisorFilters, $academicYearId: ID) {
  node(id: $projectGroupId, type: PROJECT_GROUP) {
    ... on ProjectGroup {
      id
      supervisors(filters: $filters) {
        totalCount
        pageInfo {
          hasNextPage
          endCursor
        }
        edges {
          node {
            id
            staff {
              ...supervisorInfo
            }
          }
        }
      }
    }
  }
}
