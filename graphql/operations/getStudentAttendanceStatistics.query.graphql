query getStudentAttendanceStatistics($studentId: ID!, $filters: StudentAttendanceFilters, $overAllPresenceFilter: StudentAttendanceFilters, $isAttendanceLayersEnabled: Boolean! = false) {
  node(id: $studentId, type: STUDENT) {
    id
    ... on Student {
      id
      ...studentNameFields
      attendanceV2(filters: $overAllPresenceFilter) {
        presenceOverview @skip(if: $isAttendanceLayersEnabled) {
          totalCount
          presencePercentage
          absencePercentage
          presenceNumber
          absenceNumber
        }
        attendanceMetric(type: OVERALL) @include(if: $isAttendanceLayersEnabled) {
          totalCount
          presencePercentage
          absencePercentage
          presenceNumber
          absenceNumber
        }
      }
      attendanceV2(filters: $filters) {
        statistics {
          totalCount
          totalDays
          categoryItems {
            ...attendanceStatisticCategoryItem
          }
          courseItems {
            ...attendanceStatisticCourseItem
          }
        }
      }
    }
  }
}
