    id
    value
  }
  image {
    id
    value
    resolvedMinimalTree {
      ...resolvedMinimalTreeItem
    }
  }
  duration {
    id
    uid
    value
  }
  resourceLibrary {
    leCount
    assessmentCount
  }
  template {
    id
    body
