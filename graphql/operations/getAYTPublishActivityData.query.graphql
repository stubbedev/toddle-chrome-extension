query getAYTPublishActivityData($organizationId: ID!, $activityFilters: BulkUploadActivityFilter!, $actionFilters: BulkUploadActionFilters) {
  platform {
    organization(id: $organizationId) {
      bulkUploadActivityData(filters: $activityFilters) {
        id
        status
        bulkUploadActions(filters: $actionFilters) {
          id
          actionType
          metadata
          status
        }
        actionsProgress(filters: $actionFilters)
      }
    }
  }
}
