mutation createAcademicYearGroup($input: CreateAcademicYearGroupInput!) {
  platform {
    createAcademicYearGroup(input: $input) {
      isSuccess
      warning
      academicYearGroup {
        id
        name
        acronym
        isArchived
        isCurrent
        displayOrder
        curriculumProgramWiseAcademicYearMap {
          academicYear {
            ...academicYearItem
          }
          curriculumProgram {
            id
            programType
            label
          }
        }
        academicYears {
          id
        }
      }
    }
  }
}
