fragment organizationCourseFeedEdgeItem on Organization {
  id
  courses(first: $first, after: $after, filters: $filters, orderBy: $orderBy, orderByDirection: $orderByDirection) {
    edges {
      node {
        ...courseItem
      }
    }
    pageInfo {
      endCursor
      hasNextPage
    }
  }
}

fragment courseItem on Course {
  id
  title
  genericTags {
    id
    label
    type
  }
  profileImageData {
    url
    icon
    color
    acronym
  }
  subjects {
    id
  }
  genericTags {
    id
    label
    abbreviation
  }
  subjectLevelMap {
    subject {
      id
      name
    }
    associatedLevels {
      id
      label
      abbreviation
    }
  }
  curriculumProgram {
    id
    type
    academicSetupType
  }
  learningCourse {
    id
    title
    academicCourse {
      id
      code
    }
  }
}
