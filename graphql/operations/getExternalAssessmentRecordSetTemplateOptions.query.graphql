query getExternalAssessmentRecordSetTemplateOptions($id: ID!) {
  node(id: $id, type: CURRICULUM_PROGRAM) {
    id
    ... on GenericCurriculumProgram {
      externalAssessmentTemplateFeed(input: {filters: {status: [PUBLISHED, UNPUBLISHED_CHANGES]}}) {
        edges {
          node {
            id
            name
          }
        }
      }
    }
  }
}
