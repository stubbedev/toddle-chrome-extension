query getOrganizationStudents($organizationId: ID!, $filters: OrgConnectionFilterInput) {
  node(id: $organizationId, type: ORGANIZATION) {
    ... on Organization {
      id
      students(filters: $filters) {
        edges {
          node {
            ...userItem
            ... on Student {
              alertTypes {
                ...alertTypeFields
              }
            }
          }
        }
      }
    }
  }
}
