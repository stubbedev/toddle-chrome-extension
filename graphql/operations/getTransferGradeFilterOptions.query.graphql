query getTransferGradeFilterOptions($organizationId: ID!, $filters: GradeFilterInput) {
  node(id: $organizationId, type: ORGANIZATION) {
    id
    ... on Organization {
      id
      grades(filters: $filters) {
        id
        name
        curriculumProgram {
          id
          label
          acronym
        }
      }
    }
  }
}
