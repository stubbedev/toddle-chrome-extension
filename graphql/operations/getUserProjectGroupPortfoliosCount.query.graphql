query getUserProjectGroupPortfoliosCount($id: ID!, $portfolioFilters: StudentProjectPortfolioFilters) {
  node(id: $id, type: PROJECT_GROUP) {
    id
    ... on ProjectGroup {
      id
      studentProjectPortfolio(filters: $portfolioFilters) {
        totalCount
        __typename
      }
      __typename
    }
    __typename
  }
}
