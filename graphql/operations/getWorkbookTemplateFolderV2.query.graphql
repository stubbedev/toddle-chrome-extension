query getWorkbookTemplateFolderV2($id: ID!, $types: ENTITY_TYPE_ENUM!, $searchText: String, $first: Int, $after: String, $states: [ORGANIZATION_RESOURCE_STATE_ENUM!]) {
  node(id: $id, type: $types) {
    id
    ... on WorkbookTemplateResource {
      childrenV2(first: $first, after: $after, filters: {searchText: $searchText, states: $states}) {
        pageInfo {
          hasNextPage
          hasPreviousPage
          startCursor
          endCursor
        }
        edges {
          node {
            ... on WorkbookTemplateResource {
              id
              label
              type
              resourceType
              state
              attachment {
                ...attachmentFragment
              }
              createdBy {
                id
                firstName
                middleName
                lastName
              }
            }
          }
        }
      }
    }
  }
}

query getStudentAlertTypes($id: ID!) {
  node(id: $id, type: STUDENT) {
    ... on Student {
      id
      alertTypes {
        id
        name
        icon
      }
    }
  }
}
