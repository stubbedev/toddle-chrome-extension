fragment gradebookInfo on Project {
  id
  students {
    id
    profileImage
    firstName
    middleName
    lastName
    preferredName
    suffix
    pronouns
    alertTypes {
      ...alertTypeFields
    }
  }
  ibPYPElementRatings {
    id
    ibPYPElementId
    ibPYPElementType
    value
    academicCriteriaSet {
      id
      label
      criteriaType
    }
    academicCriteriaValue {
      id
      label
      abbreviation
    }
  }
  ibPYPElementRemarks {
    id
    message
    ibPYPElementId
    ibPYPElementType
  }
  toolResponses(userFilter: ALL) {
    id
    rowId
    columnId
    subjectiveResponse
    creatorType
  }
  ...projectDetailItem
}
