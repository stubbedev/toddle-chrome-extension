query getStudentReflectionReportRemark($id: ID!, $remarkFilters: StudentReportRemarkFilter) {
  node(id: $id, type: STUDENT_PROGRESS_REPORT) {
    id
    ... on StudentProgressReport {
      id
      status
      studentReflectionTemplate
      remarks(filters: $remarkFilters) {
        ...progressReportRemarkItem
      }
    }
  }
}
