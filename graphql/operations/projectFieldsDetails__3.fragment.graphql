query getPortfolioProjectDetailsInsightsQuery($id: ID!, $filters: PlannerFieldFilter) {
  node(id: $id, type: PROJECT) {
    id
    ... on Project {
      id
      ...portfolioProjectInfo
      ...projectFieldsDetails
    }
  }
}

fragment projectFieldsDetails on Project {
  id
  fields(filters: $filters) {
    id
    uid
    value
  }
}
