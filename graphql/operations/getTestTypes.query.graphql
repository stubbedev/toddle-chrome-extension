query getTestTypes($id: ID!, $excludedTemplateIds: [ID!]) {
  node(id: $id, type: ORGANIZATION) {
    id
    ... on Organization {
      externalAssessmentTestTypes {
        id
        name
        associatedTemplates(filters: {excludedTemplateIds: $excludedTemplateIds}) {
          totalCount
        }
      }
    }
  }
}
