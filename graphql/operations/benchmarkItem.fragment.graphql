fragment benchmarkItem on PlannerBenchmark {
  id
  label
  subText
  children
  parent
  subject
  displaySequence
  depth
  code
  dataSetNodeWrapper {
    standardSet {
      id
      title
    }
    properties {
      grades {
        id
        name
      }
      subject {
        id
        isArchived
      }
    }
  }
}
