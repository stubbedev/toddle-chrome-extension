query ComplianceReportFeed($input: ComplianceReportFeedInput!) {
  complianceReport {
    complianceReportFeed(input: $input) {
      totalCount
      pageInfo {
        hasNextPage
        endCursor
      }
      edges {
        cursor
        node {
          id
          name
          dataStatus
          incompleteRecordCount
          createdAt
          updatedAt
          updatedBy {
            id
            firstName
            lastName
            profileImage
          }
          lastExportedAt
          lastExportedBy {
            id
            firstName
            lastName
            profileImage
          }
          setupValues {
            fieldUid
            values
          }
          templateVersion {
            id
            template {
              id
              code
              name
            }
          }
        }
      }
    }
  }
}
