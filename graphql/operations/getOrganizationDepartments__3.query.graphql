mutation updateSubjectDraft($id: ID!, $draftData: SubjectDraftUpdateInput!) {
  planner {
    updateSubjectDraft(id: $id, draftData: $draftData) {
      ...subjectDraftFields
    }
    __typename
  }
}

query getOrganizationDepartments($organizationId: ID!, $filters: SubjectGroupFilterInput) {
  node(id: $organizationId, type: ORGANIZATION) {
    id
    ... on Organization {
      id
      subjectGroups(filters: $filters) {
        id
        name
        displaySequence
      }
    }
  }
}
