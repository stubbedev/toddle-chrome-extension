fragment organizationCourseFeedEdgeItem on Organization {
  id
  jobFeed(first: $first, after: $after, filters: {status: $filters}, latest: $latest, curriculum: $curriculum, curriculumProgramId: $curriculumProgramId) {
    totalCount
    edges {
      node {
        ...jobData
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}
