query getUserDetailsWithLinkedIdentities($id: ID!, $type: ENTITY_TYPE_ENUM!, $first: Int, $after: String, $searchText: String) {
  node(id: $id, type: $type) {
    id
    ... on MultiAccessIdentity {
      id
      identityId
      email
      firstName
      lastName
      linkedIdentityUsersV2(first: $first, after: $after, searchText: $searchText) {
        totalCount
        edgesV2 {
          node {
            id
            identityId
            email
            firstName
            lastName
            type
            organization {
              id
              name
              logo
            }
            designation {
              id
              title
            }
            expiresAt
            isArchived
          }
        }
      }
    }
  }
}
