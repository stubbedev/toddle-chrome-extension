mutation updateProject($projectId: ID!, $status: String, $reportStatus: String, $type: PROJECT_TYPE_ENUM, $statusMessage: String, $isCompleted: Boolean) {
  documentation {
    updateProject(input: {status: $status, id: $projectId, reportStatus: $reportStatus, type: $type, statusMessage: $statusMessage, isCompleted: $isCompleted}) {
      id
    }
  }
}
