query getLastSyncTime($id: ID!, $lastSyncTimeFilterInput: LastSyncTimeFilterInput!) {
  node(id: $id, type: ORGANIZATION) {
    id
    ... on Organization {
      id
      analytics {
        lastSyncTime(filter: $lastSyncTimeFilterInput) {
          entityId
          entityType
          timestamp
        }
      }
    }
  }
}
