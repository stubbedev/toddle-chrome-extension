query getProjectGroupProjectsWithGradeBookDetails($id: ID!, $projectGradeBookFilters: ProjectGroupProjectsFilters, $projectFieldFilters: PlannerFieldFilter, $academicYearId: ID) {
  node(id: $id, type: PROJECT_GROUP) {
    ... on ProjectGroup {
      id
      ...gradeBookCriteria
      projects(filters: $projectGradeBookFilters) {
        totalCount
        pageInfo {
          endCursor
          hasNextPage
        }
        edges {
          node {
            ...gradeBookInfo
          }
        }
      }
    }
  }
}

fragment tokGradeBoundaryItem on PointAssessmentSet {
  id
  categories {
    id
    label
    displaySequence
    values {
      id
      minValue
      maxValue
    }
  }
}
