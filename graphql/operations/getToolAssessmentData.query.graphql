query getToolAssessmentData($input: IntegrationAssessmentDataInput!) {
  integration {
    getIntegrationToolAssessmentData(input: $input) {
      wait
      toolClasses {
        id
        name
        toolAssessmentCategories {
          id
          name
        }
      }
      toolStudents {
        id
        firstName
        lastName
      }
      studentMapping {
        toolId
        toddleId
      }
    }
  }
}
