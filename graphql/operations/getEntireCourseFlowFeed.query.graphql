query getEntireCourseFlowFeed($id: ID!, $filters: LearningCourseFlowFilter, $stateFilters: LearningCourseFlowStateFilter) {
  node(id: $id, type: LEARNING_COURSE) {
    id
    ... on LearningCourse {
      id
      learningCourseFlowFeedWrapper {
        learningCourseFlowFeed(first: 10000, filters: $filters) {
          edges {
            node {
              ...courseFlowResource
            }
          }
          pageInfo {
            hasNextPage
            hasPreviousPage
            startCursor
            endCursor
          }
          resourceBasedCount {
            totalCount
          }
        }
      }
      __typename
    }
    __typename
  }
}
