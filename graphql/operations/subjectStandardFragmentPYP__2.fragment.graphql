fragment subjectStandardFragmentPYP on PlannerElementNodeSetConnection {
  edges {
    node {
      id
      title
      subject {
        id
        name
        isArchived
      }
      standardSetWrapper {
        publishedBenchmarks {
          totalCount
        }
      }
      courseBenchmarkStandards(ids: [$courseId]) {
        id
      }
    }
  }
}
