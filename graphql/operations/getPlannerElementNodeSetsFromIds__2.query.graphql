query getPlannerElementNodeSetsFromIds($plannerElementNodeSetIds: [ID!], $plannerElementATLFilters: PlannerElementNodeFilters, $plannerElementNonAtlFilters: PlannerElementNodeFilters) {
  multiNode(ids: $plannerElementNodeSetIds, type: PLANNER_ELEMENT_NODE_SET) {
    ... on PlannerElementNodeSet {
      ...plannerElementNodeSetWithNodesItem
    }
  }
}
