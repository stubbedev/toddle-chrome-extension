mutation editCourseV2($id: ID!, $updatedBy: ID, $title: String, $grades: [String!], $subjectIds: [ID!], $profileImage: String, $studentsToAdd: [ID!], $studentsToRemove: [ID!], $collaboratorsAddWithId: [ID!], $collaboratorsRemoveWithId: [ID!], $isArchived: Boolean, $removedTags: [ID!], $addedTags: [ID!], $studentsWithSubjectLevel: [StudentsWithSubjectLevelInput!], $academicYears: UpdateArrayInput, $responseLanguage: ID, $sourcedId: String, $subjectLevels: UpdateArrayInput, $primaryGrade: String, $gradesWithAcademicYear: GradesWithAcademicYearUpdateInput, $primaryGradeWithAcademicYear: [GradesWithAcademicYearInput!], $academicYearId: ID, $collaboratorsAddWithIdAndAclUserRole: [collaboratorsAddWithIdAndAclUserRoleInput!], $collaboratorsUpdateWithIdAndAclUserRole: [collaboratorsAddWithIdAndAclUserRoleInput!], $associatedCourse: ID, $profileImageData: ProfileImageDataInput, $studentSubjectsAndLevels: [StudentSubjectsAndLevelsInput!], $shouldRemoveStaffFromCourse: Boolean) {
  platform {
    updateCourseV2(input: {id: $id, title: $title, grades: $grades, updatedBy: $updatedBy, subjectIds: $subjectIds, profileImage: $profileImage, studentsToAdd: $studentsToAdd, studentsToRemove: $studentsToRemove, collaboratorsAddWithId: $collaboratorsAddWithId, collaboratorsRemoveWithId: $collaboratorsRemoveWithId, isArchived: $isArchived, removedTags: $removedTags, addedTags: $addedTags, studentsWithSubjectLevel: $studentsWithSubjectLevel, studentSubjectsAndLevelsInput: $studentSubjectsAndLevels, academicYears: $academicYears, responseLanguage: $responseLanguage, sourcedId: $sourcedId, subjectLevels: $subjectLevels, primaryGrade: $primaryGrade, gradesWithAcademicYear: $gradesWithAcademicYear, primaryGradeWithAcademicYear: $primaryGradeWithAcademicYear, collaboratorsAddWithIdAndAclUserRole: $collaboratorsAddWithIdAndAclUserRole, collaboratorsUpdateWithIdAndAclUserRole: $collaboratorsUpdateWithIdAndAclUserRole, learningCourseId: $associatedCourse, profileImageData: $profileImageData, shouldRemoveStaffFromCourse: $shouldRemoveStaffFromCourse}) {
      isSuccess
      warning
      course {
        ...courseItem
      }
    }
  }
}
