query getCPGradebookProjectGroupProjects($id: ID!, $projectGradebookFilters: ProjectGroupProjectsFilters, $projectFieldFilters: PlannerFieldFilter, $academicYearId: ID) {
  node(id: $id, type: PROJECT_GROUP) {
    ... on ProjectGroup {
      id
      projects(filters: $projectGradebookFilters) {
        totalCount
        pageInfo {
          endCursor
          hasNextPage
        }
        edges {
          node {
            ...gradebookInfo
          }
        }
      }
    }
  }
}
