query getAcademicYearTerms($academicYearId: ID!, $filters: TermFilters) {
  node(id: $academicYearId, type: ACADEMIC_YEAR) {
    id
    ... on AcademicYear {
      id
      terms(filters: $filters) {
        id
        label
        startDate
        endDate
        type
        associatedAcademicTermEntities {
          id
          academicTerm {
            id
            label
            startDate
            type
          }
          cumulativeAcademicTermWeightages {
            id
            weightage
            percentage
          }
        }
      }
    }
  }
}
