query getGradeScaleDetails($id: ID!, $gradeScaleEntityDetailsFilters: GradingSetupEntityFilters) {
  node(id: $id, type: GRADE_SCALE) {
    ... on GradeScale {
      ...gradeScaleEntityDetailsItem
    }
  }
}

mutation handleGradeScaleEntityMapping($input: [GradeScaleEntityMappingInput!]!) {
  planner {
    handleGradeScaleEntityMapping(input: $input) {
      isSuccess
      warning
      jobId
    }
  }
}
