query getProgressionPoint($id: ID!) {
  node(id: $id, type: CURRICULUM_PROGRAM) {
    id
    ... on CurriculumProgram {
      progressionPoint {
        id
        label
        dependentGradeScales {
          id
          displayName
        }
        academicCriteriaValues {
          id
          label
          abbreviation
        }
      }
    }
  }
}
