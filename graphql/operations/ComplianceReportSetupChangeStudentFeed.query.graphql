query ComplianceReportSetupChangeStudentFeed($input: ComplianceReportSetupChangeStudentFeedInput!) {
  complianceReport {
    complianceReportSetupChangeStudentFeed(input: $input) {
      totalCount
      edges {
        cursor
        node {
          entityId
          firstName
          lastName
          uid
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
}
