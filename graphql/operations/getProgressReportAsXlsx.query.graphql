query getProgressReportAsXlsx($id: ID!, $csvInput: ReportTaskCsvDownloadForTranscriptInput!) {
  node(id: $id, type: COURSE_PROGRESS_REPORT_TASK) {
    id
    ... on CourseProgressReportTask {
      downloadAsExcelForTranscript(input: $csvInput) {
        ...downloadExcelResponseItem
      }
    }
  }
}
