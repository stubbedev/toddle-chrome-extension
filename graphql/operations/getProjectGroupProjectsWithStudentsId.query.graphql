query getProjectGroupProjectsWithStudentsId($id: ID!, $projectFilters: ProjectGroupProjectsFilters, $projectFieldFilters: PlannerFieldFilter) {
  node(id: $id, type: PROJECT_GROUP) {
    ... on ProjectGroup {
      id
      projects(filters: $projectFilters) {
        edges {
          node {
            id
            fields(filters: $projectFieldFilters) {
              value
              pseudoFieldUid
            }
            studentCollaborators {
              id
              student {
                id
              }
            }
          }
        }
      }
    }
  }
}
