query getContextEnabledUser($controlparameterId: ID!, $context: [ACLContextEntityInput!], $academicYearId: ID) {
  node(id: $controlparameterId, type: ACL_CONTROL_PARAMETER) {
    id
    ... on ACLPermission {
      id
      enabledUsers(context: $context, academicYearId: $academicYearId) {
        id
        email
        firstName
        middleName
        lastName
        preferredName
        prefix
        suffix
        pronouns
        type
        isArchived
      }
      __typename
    }
    __typename
  }
}
