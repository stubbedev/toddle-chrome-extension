fragment aiMessageItem on AiMessage {
  id
  role
  authorType
  isPinned
  content
  metadata
  createdBy {
    ...staffItem
    ...studentItem
  }
  votes {
    myVote
  }
  usageMetricsId
  parentMessage {
    id
  }
}

fragment staffItem on Staff {
  id
  firstName
  middleName
  lastName
  profileImage
  email
  type
  showPitchScreen
  role
  showClassSelectionScreen
  showBifurcationScreen
  isDevUser
  isArchived
  entityTags {
    id
    key
    value
  }
}
