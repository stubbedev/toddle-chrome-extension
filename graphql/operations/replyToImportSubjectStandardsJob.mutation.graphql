mutation replyToImportSubjectStandardsJob($input: ReplyToImportSubjectStandardsJobInput!) {
  platform {
    replyToImportSubjectStandardsJob(input: $input) {
      isSuccess
      warning
      job {
        ...importSubjectStandardsJobItem
      }
    }
  }
}

fragment identityPermissionsConfigurationV2Item on ConfigurationV2 {
  id
  uidV2
  configuration
  valueType
  value
  isLocked
  description
}
