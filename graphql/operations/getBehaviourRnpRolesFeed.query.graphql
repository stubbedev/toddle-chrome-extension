query getBehaviourRnpRolesFeed($id: ID!, $rnpViewFilters: RnpViewFilters!) {
  node(id: $id, type: ORGANIZATION) {
    ... on Organization {
      id
      rnpView(filters: $rnpViewFilters) {
        id
        ... on RnPRole {
          id
          label
          globalLevel
        }
      }
    }
  }
}
