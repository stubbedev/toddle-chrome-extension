mutation updateLearningCourse($input: UpdateLearningCourseInput!, $collaboratorFilters: LearningCourseCollaboratorFilters, $classesFilters: LearningCourseClassFilter, $gradeFilters: LearningCourseGradeFilters) {
  planner {
    updateLearningCourse(input: $input) {
      ...learningCourseItem
    }
    __typename
  }
}
