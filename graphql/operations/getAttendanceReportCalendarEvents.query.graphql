query getAttendanceReportCalendarEvents($rangeBeginStartDate: String!, $rangeEndStartDate: String!, $filters: CalendarEventFilter) {
  platform {
    calendarEventItems(rangeBeginStartDate: $rangeBeginStartDate, rangeEndStartDate: $rangeEndStartDate, filters: $filters) {
      id
      label
      eventType
    }
  }
}
