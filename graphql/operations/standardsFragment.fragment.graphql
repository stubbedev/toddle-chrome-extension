fragment standardsFragment on PlannerElementNode {
  id
  dataSetNodeWrapper {
    plannerElementNodeSet {
      id
      dataSetGradingConfigurations(filters: {type: GRADE_SCALE_MAPPING}) {
        id
        type
        settings {
          id
          uid
          value
        }
      }
      gradeScales {
        id
        displayName
      }
    }
    properties {
      gradeScaleGradingDetails {
        gradeScale {
          id
        }
        gradingType
        isGraded
      }
    }
  }
  uid
  label
  subText
  gradingType
  code
  depth
  parentData {
    id
  }
  standardsWrapper {
    standardSet {
      id
      title
    }
    properties {
      isArchived
      isPowerStandard
      subjects {
        id
        name
      }
      grades {
        id
        name
      }
      tags {
        id
        label
      }
    }
  }
}
