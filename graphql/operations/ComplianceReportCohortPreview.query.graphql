query ComplianceReportCohortPreview($id: ID!, $input: CohortPreviewInput!) {
  complianceReport {
    complianceReport(id: $id) {
      id
      cohortPreview(input: $input) {
        sidebarUid
        rows {
          cells {
            fieldUid
            values
          }
        }
      }
    }
  }
}
