query getStudentSubjects($id: ID!, $subjectFilters: SubjectFilter) {
  node(id: $id, type: STUDENT) {
    id
    ... on Student {
      id
      subjects(filters: $subjectFilters) {
        id
        name
        variants {
          level {
            id
            label
          }
        }
      }
    }
  }
}
