query IntegrationModuleExclusionFeed($input: IntegrationModuleExclusionFeedInput!) {
  integration {
    integrationModuleExclusionFeed(input: $input) {
      totalCount
      pageInfo {
        hasNextPage
        hasPreviousPage
        startCursor
        endCursor
      }
      edges {
        node {
          id
          ... on Course {
            title
          }
        }
      }
    }
  }
}
