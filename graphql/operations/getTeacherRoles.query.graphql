query getTeacherRoles($id: ID!) {
  node(id: $id, type: STAFF) {
    id
    ... on Staff {
      id
      rnpRoleContextDetail {
        id
        role {
          id
          label
          description
          globalLevel
          isDefaultRole
          isCustomRole
          isSuperAdmin
        }
        contextType
        context {
          id
        }
      }
    }
  }
}
