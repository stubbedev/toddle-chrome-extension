fragment benchmarkItem on PlannerBenchmark {
  id
  label
  subText
  children
  parent
  benchmarkQuestionCount {
    count
    color
    url
    yearSplit
  }
  levels {
    id
    value
    count
  }
  subject
  levelId
  displaySequence
  depth
  type
  code
  grades {
    id
    name
  }
  isLeaf
  resolvedSubject {
    id
    isArchived
  }
}
