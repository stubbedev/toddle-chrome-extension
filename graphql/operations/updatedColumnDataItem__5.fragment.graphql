fragment atlAddedFeed on PlannerATLSetWrapper {
  dataSetEditChanges(filters: {locale: $defaultLocale}) {
    addedFeed(first: $first, after: $after) {
      totalCount
      edges {
        node {
          ...basicDetailsItem
        }
      }
      pageInfo {
        ...pageInfoFields
      }
    }
  }
}

fragment updatedColumnDataItem on UpdatedColumnData {
  gradeScaleId
  columnName
  oldValue
  newValue
}
