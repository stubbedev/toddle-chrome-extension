fragment projectInfoItem on Project {
  id
  supervisors {
    isArchivedFromCurriculum(filters: $supervisorArchivedFilters)
    ...supervisorInfo
  }
  students {
    ...studentInfo
  }
  status
  studentCollaborators(filters: {roles: [COLLABORATOR]}) {
    student {
      ...studentInfo
    }
  }
  reportStatus
  finalProjectReports {
    id
  }
}
