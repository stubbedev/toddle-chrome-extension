query getOrganizationYearGroups($id: ID!, $yearGroupFilters: YearGroupFilter, $yearGroupGradeFilters: YearGroupGradeFilters) {
  node(id: $id, type: ORGANIZATION) {
    id
    ... on Organization {
      id
      yearGroups(filters: $yearGroupFilters) {
        ...basicYearGroupDetails
      }
    }
  }
}

fragment basicYearGroupDetails on YearGroup {
  id
  name
  curriculumProgram {
    id
    type
  }
  grade(filters: $yearGroupGradeFilters) {
    id
    name
  }
}
