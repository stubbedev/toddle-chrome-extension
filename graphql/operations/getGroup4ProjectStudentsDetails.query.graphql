query getGroup4ProjectStudentsDetails($id: ID!, $projectFilters: ProjectFilter, $courseFilters: CourseFilter, $studentFilters: SubjectStudentFilter, $includeInterdisciplinarySubjects: Boolean!, $isAccountDepartmentEnabled: Boolean!) {
  node(id: $id, type: PROJECT_GROUP) {
    ... on ProjectGroup {
      ...projectGroupSubjectGroupSubjectDetailsItem
    }
  }
}
