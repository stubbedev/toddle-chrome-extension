query getStudentQuestionDetailsV2($id: ID!, $type: ENTITY_TYPE_ENUM!) {
  node(id: $id, type: $type) {
    ... on Assessment {
      id
      isDeleted
      title {
        id
        uid
        value
      }
      description {
        id
        uid
        value
      }
      questions {
        totalCount
        edges {
          ...questionItem
        }
      }
    }
  }
}
