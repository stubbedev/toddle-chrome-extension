query getStudentsElementRatings($studentIds: [ID!], $startDate: String, $endDate: String, $filtersForRecentMost: ibPYPElementRatingFilterForRecentMost) {
  multiNode(ids: $studentIds, type: STUDENT) {
    id
    ... on Student {
      id
      ibPYPElementRatings(dataSet: MOST_RECENT, startDate: $startDate, endDate: $endDate, filtersForRecentMost: $filtersForRecentMost) {
        id
        ibPYPElementId
        ibPYPElementType
        academicCriteriaSet {
          id
        }
        academicCriteriaValue {
          id
        }
        isComputedRating
      }
    }
  }
}
