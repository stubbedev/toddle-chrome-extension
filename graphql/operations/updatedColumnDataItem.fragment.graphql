fragment plannerElementNodeUpdatedFeed on PlannerElementNodeSetWrapper {
  dataSetEditChanges(filters: {locale: $defaultLocale}) {
    updatedFeed(first: $first, after: $after) {
      totalCount
      edges {
        node {
          id
          oldValue {
            parentData {
              id
              uid
            }
            icon {
              id
              title
              metadata
            }
          }
          newValue {
            ...basicDetailsItem
          }
          updatedColumnData {
            ...updatedColumnDataItem
          }
        }
      }
      pageInfo {
        ...pageInfoFields
      }
    }
  }
}

fragment updatedColumnDataItem on UpdatedColumnData {
  gradeScaleId
  columnName
  oldValue
  newValue
}
