query getBulkUploadTemplateURL($organizationId: ID!, $type: String!, $subType: String, $curriculumProgramId: ID, $academicYearId: ID, $filters: bulkDataDownloadFilters) {
  node(id: $organizationId, type: ORGANIZATION) {
    id
    ... on Organization {
      name
      organizationDataBulkDownload(type: $type, subType: $subType, curriculumProgramId: $curriculumProgramId, filters: $filters, academicYearId: $academicYearId)
    }
  }
}
