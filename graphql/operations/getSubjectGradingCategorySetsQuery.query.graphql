query getSubjectGradingCategorySetsQuery($id: ID!, $filters: SubjectGradingConfigurationFilters, $gradeScaleEntityDetailsFilters: GradingSetupEntityFilters) {
  node(id: $id, type: SUBJECT) {
    id
    ... on Subject {
      id
      gradingConfigurations(filters: $filters) {
        ...GradingCategorySetsFragmentWithGradeScaleValues
      }
    }
    __typename
  }
}
