mutation updateInsightDashboard($input: UpdateInsightDashboardInput!) {
  platform {
    updateInsightDashboard(input: $input) {
      isSuccess
      warning
      insightDashboard {
        id
        name
        description
        sequence
        organizationId
        lastRefreshedAt
        createdBy
        updatedBy
        isPinned
        isDeleted
        createdAt
        updatedAt
      }
    }
  }
}
