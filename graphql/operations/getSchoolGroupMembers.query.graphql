query getSchoolGroupMembers($groupId: ID!, $input: SchoolGroupMembersInput) {
  platform {
    schoolGroup(id: $groupId) {
      id
      members(input: $input) {
        edges {
          node {
            user {
              ...schoolGroupMemberUserItem
            }
          }
        }
        pageInfo {
          hasNextPage
          endCursor
        }
      }
    }
  }
}
