mutation updateBehaviourCategory($input: BehaviourCategoryUpdateInput!) {
  platform {
    updateBehaviourCategory(input: $input) {
      id
      name
      color
      sentiment {
        id
        label
      }
      curriculumPrograms {
        id
        label
        acronym
      }
      pointsSetup {
        ...behaviourCategoryPointsSetupFragment
      }
    }
  }
}
