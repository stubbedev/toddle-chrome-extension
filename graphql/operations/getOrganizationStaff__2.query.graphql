query getOrganizationStaff($organizationId: ID!, $filters: OrgConnectionFilterInput, $academicYearId: ID) {
  node(id: $organizationId, type: ORGANIZATION) {
    ... on Organization {
      id
      staff(filters: $filters) {
        totalCount
        edges {
          node {
            ...supervisorInfo
          }
        }
      }
    }
  }
}
