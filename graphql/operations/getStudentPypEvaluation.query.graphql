query getStudentPypEvaluation($studentIds: [ID!], $filtersForRecentMost: ibPYPElementRatingFilterForRecentMost, $endDate: String) {
  multiNode(ids: $studentIds, type: STUDENT) {
    id
    ... on Student {
      id
      ibPYPElementRatings(filtersForRecentMost: $filtersForRecentMost, dataSet: MOST_RECENT, endDate: $endDate) {
        ...ratingItem
      }
    }
  }
}
