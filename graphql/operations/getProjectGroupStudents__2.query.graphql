query getProjectGroupStudents($id: ID!, $filters: ProjectGroupStudentFilters) {
  node(id: $id, type: PROJECT_GROUP) {
    ... on ProjectGroup {
      id
      students(filters: $filters) {
        totalCount
        pageInfo {
          hasNextPage
          endCursor
        }
        edges {
          node {
            id
            student {
              ...studentInfo
            }
          }
        }
      }
    }
  }
}
