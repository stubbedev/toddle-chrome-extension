query getSchoolPointSystemConfig($id: ID!) {
  node(id: $id, type: CURRICULUM_PROGRAM) {
    ... on CurriculumProgram {
      id
      pointSystemConfiguration {
        id
        isEnabled
        isStudentBalanceEnabled
        resetSchedule
        canAddPoints
        visibleToStudent
        visibleToFamily
      }
    }
  }
}
