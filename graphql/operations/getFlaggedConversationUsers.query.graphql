query getFlaggedConversationUsers($organizationId: ID!, $chatId: ID!, $input: UserV2Input!, $sentimentScoreInput: SentimentScoreInput!) {
  node(id: $chatId, type: CHAT) {
    ... on Chat {
      id
      usersV2(input: $input) {
        pageInfo {
          hasNextPage
          endCursor
        }
        edges {
          node {
            id
            firstName
            middleName
            lastName
            type
            profileImage
            messageV2SentimentScore(input: $sentimentScoreInput)
            ... on Student {
              preferredName
              pronouns
              prefix
              suffix
              yearGroup {
                id
                grade {
                  id
                  name
                }
              }
            }
            ... on Staff {
              displayRole
              preferredName
              pronouns
              prefix
              suffix
            }
            ... on FamilyMember {
              children(organizationId: $organizationId) {
                id
                profileImage
                firstName
                middleName
                lastName
                preferredName
                pronouns
                prefix
                suffix
              }
            }
          }
        }
      }
    }
  }
}
