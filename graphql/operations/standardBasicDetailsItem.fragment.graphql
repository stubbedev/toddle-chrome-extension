fragment standardBasicDetailsItem on SnPEvaluationCycleStandard {
  id
  status {
    ...statusItem
  }
  standard {
    id
    ...standardEvidenceBasicDetailsItem
  }
}

fragment attachmentEvidenceItem on Attachment {
  id
  type
  title
  streamUrl
  url
  signedUrl
  name
  mimeType
  thumbUrl
  description
  metadata
  resolvedParentEntity {
    ... on AttachmentGroup {
      resolvedParentEntity {
        ... on StudentAssignmentSubmission {
          id
          assignment {
            id
            assignedStudents {
              id
              submission {
                id
              }
            }
          }
        }
      }
    }
  }
}
