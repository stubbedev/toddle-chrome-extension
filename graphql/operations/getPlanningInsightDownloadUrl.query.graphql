query getPlanningInsightDownloadUrl($id: ID!, $unitPlanInsightUrlInput: UnitPlanInsightUrlInput!) {
  node(id: $id, type: SUBJECT) {
    id
    ... on Subject {
      id
      generateUnitPlanInsightUrl(unitPlanInsightUrlInputs: $unitPlanInsightUrlInput) {
        url
        isSuccess
      }
    }
  }
}
