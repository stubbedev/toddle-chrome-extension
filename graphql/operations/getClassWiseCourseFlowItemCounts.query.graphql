query getClassWiseCourseFlowItemCounts($learningCourseId: ID!) {
  node(id: $learningCourseId, type: LEARNING_COURSE) {
    id
    ... on LearningCourse {
      id
      classWiseCourseFlowItemCounts {
        class {
          id
        }
        counts {
          totalCount
          unitPlanCount
        }
      }
    }
    __typename
  }
}
