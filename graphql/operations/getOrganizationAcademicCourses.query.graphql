query getOrganizationAcademicCourses($id: ID!, $academicCourseFilters: AcademicCourseFilters, $orderBy: ACADEMIC_COURSE_ORDER_BY_ENUM, $orderByDirection: ORDER_BY_DIRECTION) {
  node(id: $id, type: ORGANIZATION) {
    ... on Organization {
      id
      academicCourses(orderBy: $orderBy, orderByDirection: $orderByDirection, filters: $academicCourseFilters) {
        id
        label
        code
        isArchived
      }
    }
  }
}
