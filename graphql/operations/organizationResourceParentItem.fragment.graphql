fragment organizationResourceParentItem on OrganizationResource {
  id
  label
  type
  resourceType
  item {
    ... on Question {
      id
    }
  }
  childrenV2(first: null, orderBy: DISPLAY_SEQUENCE, orderByDirection: ASC) {
    resourceTypeBasedCount {
      totalCount
    }
    edges {
      node {
        ...organizationResourceSectionItem
      }
    }
  }
}
