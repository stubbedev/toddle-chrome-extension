query getProjectGroupStudentProjectAdvisers($id: ID!, $portfolioFilters: StudentProjectPortfolioFilters, $academicYearId: ID) {
  node(id: $id, type: PROJECT_GROUP) {
    id
    ... on ProjectGroup {
      id
      studentProjectPortfolio(filters: $portfolioFilters) {
        edges {
          node {
            id
            staff {
              ...userItem
            }
          }
        }
      }
    }
  }
}
