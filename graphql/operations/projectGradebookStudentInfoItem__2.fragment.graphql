fragment projectGradebookStudentInfoItem on Student {
  ...userNameFields
  profileImage
  registrationCategory
  alertTypes {
    ...alertTypeFields
  }
  ibPYPElementRatings(dataSet: PROJECT_ASSESSMENT, filtersForGeneric: $filtersForGeneric) {
    id
    value
    ibPYPElementId
    isComputedRating
    createdAt
    createdByV2 {
      ...userNameFields
      profileImage
    }
    academicCriteriaSet {
      id
      criteriaType
    }
    academicCriteriaValue {
      id
      label
      abbreviation
      color
    }
    parent {
      id
      ... on Project {
        projectGroup {
          id
          type
        }
      }
    }
  }
}
