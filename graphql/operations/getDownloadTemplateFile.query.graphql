query getDownloadTemplateFile($organizationId: ID!, $type: String!, $subType: String!, $curriculumProgramId: ID, $academicYearId: ID) {
  node(id: $organizationId, type: ORGANIZATION) {
    id
    ... on Organization {
      name
      organizationDataBulkDownload(type: $type, subType: $subType, curriculumProgramId: $curriculumProgramId, academicYearId: $academicYearId)
    }
  }
}
