query getOutgoingTransferIds($cpId: ID!, $type: ENTITY_TYPE_ENUM!, $input: StudentTransferRequestsInput!) {
  node(id: $cpId, type: $type) {
    ... on CurriculumProgram {
      id
      outgoingStudentTransferRequestsFeed(input: $input) {
        edges {
          node {
            id
            status
          }
        }
      }
    }
  }
}
