query getAccountGradingPeriods($academicYearId: ID!, $curriculumProgramIds: [ID!], $curriculumProgramType: String, $parentAcademicTermIds: [ID!]) {
  node(id: $academicYearId, type: ACADEMIC_YEAR) {
    id
    ... on AcademicYear {
      id
      academicTerms(filters: {curriculumProgramIds: $curriculumProgramIds, curriculumProgramType: $curriculumProgramType, parentAcademicTermIds: $parentAcademicTermIds}) {
        totalCount
        edges {
          node {
            ...accountGradingPeriodItem
            schoolCount(filters: {academicYearIds: [$academicYearId]})
            childAcademicTerms(filters: {academicYearIds: [$academicYearId]}) {
              id
              label
              curriculumProgram {
                id
                label
                acronym
                logo
              }
            }
          }
        }
      }
    }
  }
}
