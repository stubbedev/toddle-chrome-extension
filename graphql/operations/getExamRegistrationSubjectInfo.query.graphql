query getExamRegistrationSubjectInfo($id: ID!, $filters: ExamRegistrationStudentFilterInput, $subjectFilters: ExamRegistrationUserSubjectsFilterInput) {
  node(id: $id, type: EXAM_REGISTRATION) {
    ... on ExamRegistration {
      id
      allStudents(filters: $filters) {
        ...ibisExamRegStudent
      }
    }
  }
}
