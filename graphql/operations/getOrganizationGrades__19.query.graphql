query getOrganizationGrades($id: ID!, $filters: GradeFilterInput) {
  node(id: $id, type: ORGANIZATION) {
    ... on Organization {
      id
      grades(filters: $filters) {
        id
        name
        displaySequence
        curriculumProgram {
          id
          type
          acronym
        }
        globalGrade {
          id
          uid
          name
          displaySequence
        }
        yearGroup {
          id
          name
        }
      }
    }
  }
}
