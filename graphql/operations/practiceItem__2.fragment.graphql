fragment practiceItem on SnPPractice {
  id
  code
  type
  localeLabelKey
  taggedEvidence(first: $first, after: $after, orderBy: $orderBy, orderByDirection: $orderByDirection, applyDashboardEvidenceCategoryOrdering: $applyDashboardEvidenceCategoryOrdering, filters: $evidenceFilters) {
    totalCount
    pageInfo {
      endCursor
      hasNextPage
    }
    edges {
      node {
        ...evidenceItem
      }
    }
  }
}
