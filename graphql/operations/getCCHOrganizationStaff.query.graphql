query getCCHOrganizationStaff($organizationId: ID!, $filters: OrgConnectionFilterInput, $first: Int, $after: String) {
  node(id: $organizationId, type: ORGANIZATION) {
    id
    ... on Organization {
      id
      staff(filters: $filters, first: $first, after: $after) {
        totalCount
        pageInfo {
          hasNextPage
          endCursor
        }
        edges {
          node {
            id
            firstName
            lastName
          }
        }
      }
    }
  }
}
