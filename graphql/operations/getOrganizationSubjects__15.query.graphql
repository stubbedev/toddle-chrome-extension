query getOrganizationSubjects($id: ID!, $filters: SubjectFilterInput) {
  node(id: $id, type: ORGANIZATION) {
    id
    ... on Organization {
      id
      subjects(filters: $filters) {
        id
        name
        grades {
          id
        }
        curriculumProgram {
          id
          acronym
          type
        }
      }
    }
  }
}
