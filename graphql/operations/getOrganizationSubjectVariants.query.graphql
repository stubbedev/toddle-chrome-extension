query getOrganizationSubjectVariants($id: ID!) {
  node(id: $id, type: IB_DP_CURRICULUM_PROGRAM) {
    ... on IbDpCurriculumProgram {
      id
      subjectVariants(filters: {archivalState: ALL}) {
        subject {
          name
          id
          icon
          iconType
          type
          ibOfferedSubject {
            id
            contentSubject {
              id
              assessmentYearTitle
              assessmentYearEndsOn
            }
          }
          isArchived
          associatedLevels {
            id
            label
            type
          }
          flatVariants(filters: {archivalState: ALL}) {
            level {
              id
              label
            }
            responseLanguage {
              id
              label
            }
            isArchived
          }
          subjectGroup {
            id
            globalSubjectGroup {
              id
            }
          }
        }
        subjectGroup {
          id
          name
          type
          globalSubjectGroup {
            id
            name
            type
          }
          displaySequence
        }
      }
    }
  }
}
